# kestrel profile. Copy this file to profile.toml (gitignored) and make it yours.
# Never put a key or password in here: a source names the environment variable that holds it.

[you]
name = "Alex"

[app]
name = "kestrel"
accent = "rufous"          # rufous | slate | mono
theme = "system"           # system | dark | light
gain_loss = "green-red"    # green-red | blue-orange
density = "comfortable"    # comfortable | compact
currency = "USD"
timezone = "America/New_York"

[benchmark]                # the index your money is compared with; an fdc source draws it from its own prices
symbol = "SPY"
label = "S&P 500"

# Optional: your own logos, one image per institution or symbol, named in lower case with only letters and digits
# ("Capital One" -> capitalone.svg, AAPL -> aapl.png; .svg .png .webp .jpg). kestrel never fetches a logo: keep this
# folder outside git (logos/ is gitignored), and a row without a logo keeps its initials.
#
# [logos]
# folder = "logos"          # relative to this file's folder

# Where your data comes from. The demo source works out of the box; see docs/connectors.md for every kind.
[[sources]]
id = "demo"
kind = "demo"
label = "Demo data"

# Your accounts, from financial-data-collector's warehouse (read-only). Replace the demo source above with this one:
#
# [[sources]]
# id = "portfolio"
# kind = "fdc"
# label = "Portfolio"
# path = "../financial-data-collector/data/warehouse.db"   # relative to this file's folder
# stale_after = "36h"
#
# [sources.categories]         # optional: account id or exact label = long_term | trading | cash | other
# "brokerage-2" = "trading"    # (a card or a loan comes from a feed as a debt account, not from the collector)
#
# A system of your own (a trading desk) that serves the kestrel contract as JSON: its books, strategies, trades and
# runs. Add it next to your other sources; `kestrel demo` prints an example payload:
#
# [[sources]]
# id = "desk"
# kind = "feed"
# label = "Trading desk"
# url = "http://127.0.0.1:8000/api/feed"   # or: path = "../desk/feed.json" (relative to this file's folder)
# token_env = "KESTREL_DESK_TOKEN"          # optional: the NAME of the environment variable holding a bearer token
# timeout = 5                               # optional: seconds, 1 to 60
# stale_after = "15m"
#
# Or, with no server at all, a program kestrel runs itself, whose output is the same JSON (never through a shell):
#
# [[sources]]
# id = "desk"
# kind = "feed"
# label = "Trading desk"
# command = ["../desk/.venv/Scripts/python.exe", "-m", "desk.feed_export"]  # the program, then its arguments
# cwd = "../desk"             # optional: the folder it runs in (default: this file's folder)
# timeout = 30                # optional: seconds, 1 to 120
# refresh = "1m"              # optional: how long one run's output is reused, 5s to 1h
# stale_after = "15m"
#
# A trading-rails install's own paper book: reads its paper.json and runs.jsonl (never trading_rails itself):
#
# [[sources]]
# id = "rails"
# kind = "rails"
# label = "Paper (trading-rails)"
# path = "../trading-rails/data"   # the folder holding paper.json and runs.jsonl (relative to this file's folder)
# stale_after = "36h"
#
# When two sources use the same id, the one higher up in this file wins.
